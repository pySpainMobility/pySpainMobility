{% set name = "pyspainmobility" %}
{% set version = "2.0.0" %}
{% set python_min = "3.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyspainmobility-{{ version }}.tar.gz
  sha256: 39c2708c37026fe250617bffdf569a42d1f88bba899893ea520a5b53741b0576

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - wheel
  run:
    - python >={{ python_min }}
    - geopandas >=1.0.1,<1.1.dev0
    - tqdm >=4.0.0
    - matplotlib-base >=3.0.0
    - pyarrow >=8.0.0
    - dask >=2024.0
    - polars >=1.25,<2
    - scipy >=1.11

test:
  imports:
    - pyspainmobility
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}


about:
  home: https://github.com/pySpainMobility/pySpainMobility
  summary: Library for downloading and processing Spanish mobility data from MITMA
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - CiroBen99
