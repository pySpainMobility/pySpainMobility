{% set name = "pyspainmobility" %}
{% set version = "2.1.2" %}
{% set python_min = "3.10" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyspainmobility-{{ version }}.tar.gz
  sha256: 46bf02218a019f2415494ae4276d9b5d27fbcf615aca4f1ab8412655a3392b83

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - wheel
  run:
    - python >={{ python_min }}
    - geopandas-base >=1.1.4,<1.2
    - pyogrio >=0.7.2
    - pyproj >=3.5
    - pandas >=2.0
    - tqdm >=4.0.0
    - polars >=1.25,<2
    - scipy >=1.11

test:
  imports:
    - pyspainmobility
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}


about:
  home: https://github.com/pySpainMobility/pySpainMobility
  summary: Library for downloading and processing Spanish mobility data from MITMA
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - CiroBen99
