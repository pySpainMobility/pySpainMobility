name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: python -m pip install -e '.[arrow]' pytest
      - name: Run test suite
        run: python -m pytest -q -m "not network_adapter"

  optional-network-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with optional network adapters
        run: python -m pip install -e '.[network,infomap]' pytest
      - name: Run network integration tests
        run: python -m pytest -q tests/test_network.py -m network_adapter

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install supported minimum dependencies
        run: >-
          python -m pip install -e '.[arrow]' pytest
          'numpy==1.26.4' 'pandas==2.0.0' 'polars==1.25.2'
          'scipy==1.11.1' 'geopandas==1.1.4' 'pyarrow==8.0.0'
      - name: Run core tests against minimum dependencies
        run: python -m pytest -q -m "not network_adapter"

  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base package and test runner
        run: python -m pip install -e . pytest
      - name: Test base features without optional dependencies
        run: python -m pytest -q tests/test_minimal_install.py tests/test_provinces.py -m minimal_install
